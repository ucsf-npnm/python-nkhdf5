[project]
name = "python-nkhdf5"
version = "2024.01.03"
description = "NKHDF5"
authors = [{ name = "Ankit Khambhati", email = "akhambhati@gmail.com" }]
requires-python = ">=3.11,<4.0"
readme = "README.md"
license = "Apache-2.0"
classifiers = ["Development Status :: 1 - Planning"]
dependencies = [
    "click>=8.0.1",
    "pyedflib>=0.1.40,<0.2",
    "edfio>=0.4.8,<0.5",
    "pycap>=2.7.0,<3",
    "pandas>=2.3.2",
    "baseobjects",
    "classversioning",
    "hdf5objects",
]

[project.urls]
Homepage = "https://github.com/akhambhati/python-nkhdf5"
Repository = "https://github.com/akhambhati/python-nkhdf5"
Documentation = "https://python-nkhdf5.readthedocs.io"
Changelog = "https://github.com/akhambhati/python-nkhdf5/releases"

[project.scripts]
python-nkhdf5 = "nkhdf5.__main__:main"

[dependency-groups]
dev = [
    "Pygments>=2.10.0",
    "black>=21.10b0",
    "coverage[toml]>=6.2",
    "darglint>=1.8.1",
    "flake8>=4.0.1",
    "flake8-bandit>=2.1.2",
    "flake8-bugbear>=21.9.2",
    "flake8-docstrings>=1.6.0",
    "flake8-rst-docstrings>=0.2.5",
    "furo>=2021.11.12",
    "isort>=5.10.1",
    "mypy>=0.930",
    "pep8-naming>=0.12.1",
    "pre-commit>=2.16.0",
    "pre-commit-hooks>=4.1.0",
    "pytest>=6.2.5",
    "pyupgrade>=2.29.1",
    "safety>=1.10.3",
    "sphinx>=4.3.2",
    "sphinx-autobuild>=2021.3.14",
    "sphinx-click>=3.0.2",
    "typeguard>=2.13.3",
    "xdoctest[colors]>=0.15.10",
    "myst-parser>=0.16.1",
    "ipython>=8.14.0,<9",
]

[tool.uv]

[tool.uv.sources]
baseobjects = { git = "ssh://git@github.com/AnthonyTechnologies/python-baseobjects.git" }
classversioning = { git = "ssh://git@github.com/AnthonyTechnologies/python-classversioning.git" }
hdf5objects = { git = "ssh://git@github.com/AnthonyTechnologies/python-hdf5objects.git" }

[tool.hatch.build.targets.sdist]
include = ["src/nkhdf5"]

[tool.hatch.build.targets.wheel]
include = ["src/nkhdf5"]

[tool.hatch.build.targets.wheel.sources]
"src/nkhdf5" = "nkhdf5"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.coverage.paths]
source = ["src", "*/site-packages"]
tests = ["tests", "*/tests"]

[tool.coverage.run]
branch = true
source = ["nkhdf5", "tests"]

[tool.coverage.report]
show_missing = true
fail_under = 100

[tool.isort]
profile = "black"
force_single_line = true
lines_after_imports = 2

[tool.mypy]
strict = true
warn_unreachable = true
pretty = true
show_column_numbers = true
show_error_codes = true
show_error_context = true
